<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#00E5A0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofGrad" x1="256" y1="96" x2="256" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#00C484"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="256" y1="256" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162820"/>
      <stop offset="100%" stop-color="#0F1F18"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#0A0A0F"/>
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>

  <!-- House body -->
  <rect x="118" y="254" width="276" height="178" rx="6" fill="url(#bodyGrad)"/>

  <!-- Roof -->
  <path d="M80 270 L256 96 L432 270Z" fill="url(#roofGrad)"/>

  <!-- Roof ridge highlight -->
  <path d="M256 96 L432 270" stroke="#00FFB2" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>

  <!-- Roof overhang bottom shadow -->
  <rect x="118" y="254" width="276" height="14" fill="#00A870" opacity="0.35"/>

  <!-- Left window -->
  <rect x="140" y="284" width="78" height="62" rx="10" fill="#0A1410"/>
  <rect x="140" y="284" width="78" height="62" rx="10" fill="#00E5A0" fill-opacity="0.08"/>
  <rect x="140" y="284" width="78" height="62" rx="10" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- window cross -->
  <line x1="179" y1="284" x2="179" y2="346" stroke="#00E5A0" stroke-width="1.5" opacity="0.25"/>
  <line x1="140" y1="315" x2="218" y2="315" stroke="#00E5A0" stroke-width="1.5" opacity="0.25"/>

  <!-- Right window -->
  <rect x="294" y="284" width="78" height="62" rx="10" fill="#0A1410"/>
  <rect x="294" y="284" width="78" height="62" rx="10" fill="#00E5A0" fill-opacity="0.08"/>
  <rect x="294" y="284" width="78" height="62" rx="10" fill="none" stroke="#00E5A0" stroke-width="1.5" stroke-opacity="0.35"/>
  <!-- window cross -->
  <line x1="333" y1="284" x2="333" y2="346" stroke="#00E5A0" stroke-width="1.5" opacity="0.25"/>
  <line x1="294" y1="315" x2="372" y2="315" stroke="#00E5A0" stroke-width="1.5" opacity="0.25"/>

  <!-- Door arch -->
  <path d="M220 432 L220 352 Q220 318 256 318 Q292 318 292 352 L292 432Z" fill="#060E0A"/>
  <!-- Door knob -->
  <circle cx="283" cy="380" r="5" fill="#00E5A0" opacity="0.5"/>

  <!-- Bottom floor line -->
  <rect x="118" y="426" width="276" height="6" rx="3" fill="#00E5A0" opacity="0.12"/>
</svg>
